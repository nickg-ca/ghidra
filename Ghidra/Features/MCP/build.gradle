apply from: "$rootProject.projectDir/gradle/distributableGhidraModule.gradle"
apply from: "$rootProject.projectDir/gradle/javaProject.gradle"
apply from: "$rootProject.projectDir/gradle/helpProject.gradle"
apply from: "$rootProject.projectDir/gradle/jacocoProject.gradle"
apply from: "$rootProject.projectDir/gradle/javaTestProject.gradle"
apply from: "$rootProject.projectDir/gradle/javadoc.gradle"
apply plugin: 'eclipse'

eclipse.project.name = 'Features MCP'

dependencies {
	api project(':Base')
	api project(':Decompiler')

	// MCP SDK
	api 'io.modelcontextprotocol.sdk:mcp:0.17.0'

	// Jetty and Servlet API for HTTP Transport
	implementation 'jakarta.servlet:jakarta.servlet-api:5.0.0'
	implementation 'org.eclipse.jetty:jetty-server:11.0.20'
	implementation 'org.eclipse.jetty:jetty-servlet:11.0.20'
	implementation 'org.slf4j:slf4j-simple:2.0.7'

	testImplementation project(path: ':Base', configuration: 'testArtifacts')
	testImplementation project(path: ':Decompiler', configuration: 'testArtifacts')
	testImplementation project(path: ':SoftwareModeling', configuration: 'testArtifacts')
}
